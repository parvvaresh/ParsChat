services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parschat-backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_PATH=/app/chat.db
      - JWT_SECRET=change-this-in-production
    volumes:
      - ./uploads:/app/uploads
      - ./chat.db:/app/chat.db
    restart: unless-stopped