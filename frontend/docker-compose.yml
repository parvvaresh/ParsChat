services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: parschat-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_PROXY_TARGET=http://host.docker.internal:8080
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped